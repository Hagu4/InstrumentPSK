server {
    listen 80;
    server_name instrumentpsk.ru www.instrumentpsk.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name instrumentpsk.ru www.instrumentpsk.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/instrumentpsk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/instrumentpsk.ru/privkey.pem;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /static/ {
        alias /var/www/static/;
        client_max_body_size 50M;
    }

    location /media/ {
        alias /app/media/;
        client_max_body_size 50M;
        # Also blocks active files uploaded before application-side validation existed.
        if ($uri !~* "\.(jpe?g|png|webp|gif|ico)$") { return 404; }
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
}
