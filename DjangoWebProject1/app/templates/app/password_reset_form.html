{% extends "app/layout.html" %}
{% block styles %}<style>
.password-reset-page{min-height:calc(100vh - 150px);display:grid;place-items:center;padding:40px 16px;background:#f7f8fa}
.password-reset-card{width:min(100%,460px);padding:36px 38px;border:1px solid #e3e7ee;border-radius:20px;background:#fff;box-shadow:0 16px 40px rgba(15,23,42,.08)}
.password-reset-card h2{margin:0 0 10px;color:#111827;font-size:28px}.password-reset-card .subtitle{margin:0 0 26px;color:#64748b;line-height:1.5}
.password-reset-card form p{margin:0 0 18px}.password-reset-card label{display:block;margin-bottom:8px;color:#334155;font-size:14px;font-weight:600}.password-reset-card input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;outline:0}.password-reset-card input:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.14)}
.password-reset-card .btn-login{width:100%;margin-top:8px;border:0;border-radius:10px;padding:13px 16px;background:#f97316;color:#fff;font-weight:700;cursor:pointer}.password-reset-card .btn-login:hover{background:#ea580c}.password-reset-card .forgot-password-link{display:inline-block;margin-top:18px;color:#f97316;text-decoration:none}.password-reset-card ul.errorlist{margin:6px 0 0;padding:0;color:#dc2626;list-style:none;font-size:13px}
@media(max-width:600px){.password-reset-page{padding:24px 12px}.password-reset-card{padding:28px 22px}}
</style>{% endblock %}
{% block content %}
<main class="password-reset-page"><div class="password-reset-card">
<h2>Восстановление пароля</h2><p class="subtitle">Введите email, указанный при регистрации.</p>
<form method="post">{% csrf_token %}{{ form.email.label_tag }}{{ form.email }}{{ form.email.errors }}<button class="btn btn-login" type="submit">Отправить ссылку</button></form>
<a class="forgot-password-link" href="{% url 'login' %}">Вернуться ко входу</a>
</div></main>
{% endblock %}
