{% extends "app/layout.html" %}
{% block styles %}<style>.password-reset-page{min-height:calc(100vh - 150px);display:grid;place-items:center;padding:48px 16px;background:#f7f8fa}.password-reset-card{width:min(100%,500px);padding:40px;border:1px solid #e5e7eb;border-radius:22px;background:#fff;box-shadow:0 18px 45px rgba(15,23,42,.09)}.password-reset-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;color:#0f172a;font-weight:800}.password-reset-brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#f97316;color:#fff;font-size:20px}.password-reset-card h2{margin:0 0 10px;color:#0f172a;font-size:30px}.password-reset-card p{color:#64748b;line-height:1.55}.password-reset-card .btn-login{display:block;margin-top:26px;text-align:center;border-radius:10px;padding:14px 16px;background:#f97316;color:#fff;font-weight:700;text-decoration:none}.password-reset-card .btn-login:hover{background:#ea580c}</style>{% endblock %}
{% block content %}<main class="password-reset-page"><div class="password-reset-card"><div class="password-reset-brand"><span class="password-reset-brand-mark">✓</span><span>InstrumentPSK</span></div><h2>Пароль изменён</h2><p>Новый пароль сохранён. Теперь можно войти в аккаунт.</p><a class="btn btn-login" href="{% url 'login' %}">Войти в аккаунт</a></div></main>{% endblock %}
