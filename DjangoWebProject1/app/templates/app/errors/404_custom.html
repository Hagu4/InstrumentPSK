{% extends "app/layout.html" %}
{% load static %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
    <div style="max-width: 600px;">
        <div style="font-size: 10rem; font-weight: 900; color: #f1f5f9; line-height: 1; margin-bottom: -2rem;">404</div>
        <div style="position: relative; z-index: 1;">
            <div style="font-size: 4rem; color: #FF6B00; margin-bottom: 1rem;"><i class="fas fa-tools"></i></div>
            <h1 style="font-size: 2.5rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem;">Упс! Страница потерялась</h1>
            <p style="font-size: 1.2rem; color: #64748B; margin-bottom: 2.5rem; line-height: 1.6;">
                Похоже, эта страница ушла на диагностику или её никогда не существовало. 
                Но у нас есть сотни отличных инструментов, которые точно на месте!
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="{% url 'catalog' %}" class="btn" style="background: #FF6B00; color: white; padding: 15px 35px; border-radius: 12px; font-weight: 700; text-decoration: none; transition: transform 0.2s;">Перейти в каталог</a>
                <a href="{% url 'home' %}" class="btn" style="background: #f1f5f9; color: #0f172a; padding: 15px 35px; border-radius: 12px; font-weight: 700; text-decoration: none;">На главную</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
