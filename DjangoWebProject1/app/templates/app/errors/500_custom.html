{% extends "app/layout.html" %}
{% load static %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
    <div style="max-width: 600px;">
        <div style="font-size: 10rem; font-weight: 900; color: #fef2f2; line-height: 1; margin-bottom: -2rem;">500</div>
        <div style="position: relative; z-index: 1;">
            <div style="font-size: 4rem; color: #DC2626; margin-bottom: 1rem;"><i class="fas fa-exclamation-triangle"></i></div>
            <h1 style="font-size: 2.5rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem;">Технический сбой</h1>
            <p style="font-size: 1.2rem; color: #64748B; margin-bottom: 2.5rem; line-height: 1.6;">
                Что-то сломалось в наших внутренних механизмах. Мы уже вызвали мастера и скоро всё починим! 
                Попробуйте обновить страницу или зайти чуть позже.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="{% url 'home' %}" class="btn" style="background: #0f172a; color: white; padding: 15px 35px; border-radius: 12px; font-weight: 700; text-decoration: none;">На главную</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
